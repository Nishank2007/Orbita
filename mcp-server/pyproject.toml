[project]
name = "orbita-mcp"
version = "0.1.0"
description = "ORBITA Model Context Protocol Server with Streamable HTTP Transport"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3.0",
    "httpx>=0.28.1",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.1",
    "uvicorn>=0.34.0",
    "starlette>=0.45.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
